[project]
name = "evaluation"
version = "0.1.0"
description = "Evaluation harness for the Agentic Text-to-SQL Analytics Platform"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.10.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.25.0,<1.0",
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["evaluation", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "T20", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
