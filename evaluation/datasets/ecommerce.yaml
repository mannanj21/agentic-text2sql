    gold_sql: |
      SELECT oi.order_item_id, p.name AS product_name, oi.quantity, oi.unit_price
      FROM public.order_items oi
      JOIN public.products p ON p.product_id = oi.product_id
      ORDER BY oi.order_item_id
    difficulty: medium
    category: join
    expected_intent: ANSWER
    expected_tables: ["public.order_items", "public.products"]
    order_sensitive: true
    followup_of: null
    notes: null
    split: dev

  - id: ec-012
    db: ecommerce
    question: "Which customers have placed more than 3 orders?"
    gold_sql: |
      SELECT c.customer_id, c.name, count(o.order_id) AS order_count
      FROM public.customers c
      JOIN public.orders o ON o.customer_id = c.customer_id
      GROUP BY c.customer_id, c.name
      HAVING count(o.order_id) > 3
      ORDER BY order_count DESC
    difficulty: medium
    category: join
    expected_intent: ANSWER
    expected_tables: ["public.customers", "public.orders"]
    order_sensitive: true
    followup_of: null
    notes: null
    split: dev

  # ─── GROUPING (medium) ───────────────────────────────────────────────────
  - id: ec-013
