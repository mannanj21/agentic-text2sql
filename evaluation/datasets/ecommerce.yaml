  - id: ec-018
    db: ecommerce
    question: "Show the top 5 customers by total spend in the last quarter."
    gold_sql: |
      SELECT c.customer_id, c.name, sum(o.total_amount) AS total_spend
      FROM public.orders o
      JOIN public.customers c ON c.customer_id = o.customer_id
      WHERE o.created_at >= date_trunc('quarter', CURRENT_DATE - INTERVAL '3 months')
        AND o.created_at < date_trunc('quarter', CURRENT_DATE)
      GROUP BY c.customer_id, c.name
      ORDER BY total_spend DESC
      LIMIT 5
    difficulty: hard
    category: time
    expected_intent: ANSWER
    expected_tables: ["public.orders", "public.customers"]
    order_sensitive: true
    followup_of: null
    notes: null
    split: test

