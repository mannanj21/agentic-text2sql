  # ─── JOIN (medium) ───────────────────────────────────────────────────────
  - id: ec-010
    db: ecommerce
    question: "For each order, show the customer name and total amount."
    gold_sql: |
      SELECT o.order_id, c.name AS customer_name, o.total_amount
      FROM public.orders o
      JOIN public.customers c ON c.customer_id = o.customer_id
      ORDER BY o.order_id
    difficulty: medium
    category: join
    expected_intent: ANSWER
    expected_tables: ["public.orders", "public.customers"]
    order_sensitive: true
    followup_of: null
    notes: null
    split: test

  - id: ec-011
