  - id: ec-020
    db: ecommerce
    question: "Find customers whose total spend is above the average customer spend."
    gold_sql: |
      SELECT c.customer_id, c.name, sum(o.total_amount) AS total_spend
      FROM public.customers c
      JOIN public.orders o ON o.customer_id = c.customer_id
      GROUP BY c.customer_id, c.name
      HAVING sum(o.total_amount) > (
        SELECT avg(customer_total) FROM (
          SELECT sum(total_amount) AS customer_total FROM public.orders GROUP BY customer_id
        ) t
      )
      ORDER BY total_spend DESC
    difficulty: hard
    category: subquery
    expected_intent: ANSWER
    expected_tables: ["public.customers", "public.orders"]
    order_sensitive: true
    followup_of: null
    notes: null
    split: dev

