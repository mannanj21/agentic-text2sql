  # ─── HARD ANALYTICS (hard) ───────────────────────────────────────────────
  - id: ec-034
    db: ecommerce
    question: "What is the month-over-month revenue growth rate?"
    gold_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', created_at) AS month, sum(total_amount) AS revenue
        FROM public.orders
        GROUP BY 1
      )
      SELECT month,
             revenue,
             lag(revenue) OVER (ORDER BY month) AS prev_revenue,
             round(
               (revenue - lag(revenue) OVER (ORDER BY month)) /
               NULLIF(lag(revenue) OVER (ORDER BY month), 0) * 100, 2
             ) AS growth_pct
      FROM monthly
      ORDER BY month
    difficulty: hard
    category: time
    expected_intent: ANSWER
    expected_tables: ["public.orders"]
    order_sensitive: true
    followup_of: null
    notes: "Window function + CTE."
    split: test

  - id: ec-035
    db: ecommerce
    question: "Which product category has the highest repeat purchase rate?"
    gold_sql: |
      WITH customer_categories AS (
        SELECT o.customer_id, p.category, count(DISTINCT o.order_id) AS purchase_count
        FROM public.orders o
        JOIN public.order_items oi ON oi.order_id = o.order_id
        JOIN public.products p ON p.product_id = oi.product_id
        GROUP BY o.customer_id, p.category
      )
      SELECT category,
             count(*) FILTER (WHERE purchase_count > 1) AS repeat_buyers,
             count(*) AS total_buyers,
             round(count(*) FILTER (WHERE purchase_count > 1)::numeric / NULLIF(count(*), 0) * 100, 2) AS repeat_rate_pct
      FROM customer_categories
      GROUP BY category
      ORDER BY repeat_rate_pct DESC
      LIMIT 1
    difficulty: hard
    category: subquery
    expected_intent: ANSWER
    expected_tables: ["public.orders", "public.order_items", "public.products"]
    order_sensitive: true
    followup_of: null
    notes: null
    split: test

