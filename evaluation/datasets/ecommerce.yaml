    gold_sql: |
      SELECT date_trunc('month', created_at) AS month, count(*) AS order_count
      FROM public.orders
      WHERE date_part('year', created_at) = date_part('year', CURRENT_DATE)
      GROUP BY 1
      ORDER BY 1
    difficulty: medium
    category: grouping
    expected_intent: ANSWER
    expected_tables: ["public.orders"]
    order_sensitive: true
    followup_of: null
    notes: "Uses CURRENT_DATE — deterministic if run against seeded data."
    split: dev

