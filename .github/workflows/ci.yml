name: CI

on:
  push:
    branches: [ "main", "stage/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & Format (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: cd backend && uv sync --all-extras
      - name: Ruff Check
        run: cd backend && uv run ruff check app tests
      - name: Ruff Format
        run: cd backend && uv run ruff format --check app tests
      - name: Mypy
        run: cd backend && uv run mypy app

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: cd backend && uv sync --all-extras
      - name: Run Unit Tests
        run: cd backend && uv run pytest tests/unit -x -q --tb=short

  frontend:
    name: Frontend Checks and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint, typecheck, unit tests, and build
        run: cd frontend && npm run lint && npm run typecheck && npm run test && npm run build
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run page E2E tests
        working-directory: frontend
        run: npm run dev -- --hostname 127.0.0.1 > vite-ci.log 2>&1 & npx --yes wait-on http://127.0.0.1:3000 && npx playwright test

  authz:
    name: Authorization Matrix
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5433/test_db
      SESSION_SECRET: ci-session-secret-not-production
      LLM_PROVIDER: fake
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Log in to Docker Hub with retry when credentials are configured
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Generate ephemeral encryption key
        run: echo "ENCRYPTION_KEY=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> $GITHUB_ENV
      - name: Start test database
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.test.yml up -d --wait; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Install dependencies and migrate
        run: cd backend && uv sync --all-extras && uv run alembic upgrade head
      - name: Run authorization matrix
        run: cd backend && uv run pytest tests/authz -q --tb=short

  security:
    name: Seeded Security Suite
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5433/test_db
      SESSION_SECRET: ci-session-secret-not-production
      LLM_PROVIDER: fake
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Log in to Docker Hub with retry when credentials are configured
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Generate ephemeral encryption key
        run: echo "ENCRYPTION_KEY=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> $GITHUB_ENV
      - name: Start test and seeded demo databases
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.test.yml up -d --wait && docker compose up -d demo-ecommerce --wait; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Install dependencies and migrate test database
        run: cd backend && uv sync --all-extras && uv run alembic upgrade head
      - name: Run security corpus and database-boundary suite
        run: cd backend && uv run pytest tests/security -q --tb=short
