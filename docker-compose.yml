services:
  app-db:
    image: pgvector/pgvector:pg16
    container_name: agentic-text2sql-db
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: text2sql
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d text2sql"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:changeme@app-db:5432/text2sql
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      app-db:
        condition: service_healthy
    restart: "no"

  api-1:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:changeme@app-db:5432/text2sql
      REPLICA_ID: api-1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-2:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:changeme@app-db:5432/text2sql
      REPLICA_ID: api-2
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-ecommerce:
    image: postgres:16
    container_name: agentic-demo-ecommerce
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ecommerce
    ports:
      - "5434:5432"
    volumes:
      - demo-ecommerce-data:/var/lib/postgresql/data
      - ./seeds/ecommerce/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seeds/ecommerce/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
      - ./seeds/roles/03_roles.sql:/docker-entrypoint-initdb.d/03_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  demo-pagila:
    image: postgres:16
    container_name: agentic-demo-pagila
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: pagila
    ports:
      - "5435:5432"
    volumes:
      - demo-pagila-data:/var/lib/postgresql/data
      - ./seeds/pagila/01_pagila-schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seeds/pagila/02_pagila-data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
      - ./seeds/roles/03_roles.sql:/docker-entrypoint-initdb.d/03_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pagila"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app-db-data:
  demo-ecommerce-data:
  demo-pagila-data:
