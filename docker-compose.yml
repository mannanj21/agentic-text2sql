version: '3.8'

services:
  app-db:
    image: pgvector/pgvector:pg16
    container_name: agentic-text2sql-db
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: text2sql
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d text2sql"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app-db-data:
